# Versi API untuk object Secret
apiVersion: v1
# Jenis object yang dibuat
kind: Secret
# Metadata object
metadata:
  # Nama Secret
  name: mongo-secret
  # Label untuk mengelompokkan object milik MongoDB
  labels:
    app: mongo
# Tipe Secret generik berisi pasangan key-value
type: Opaque
# Data kredensial MongoDB dalam bentuk base64
data:
  # "admin" dalam base64
  MONGO_ROOT_USERNAME: YWRtaW4=
  # "supersecretpassword" dalam base64
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
